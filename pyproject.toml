[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wg_gaming_installer"
version = "0.1.0"
description = "Small installer/manager for WireGuard server and clients (Python)"
readme = "README.md"
authors = [{ name = "xiahua" }]
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9",
  "prompt_toolkit>=3.0",
  "distro>=1.8",
]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "isort==8.0.1",
  "mypy==2.3.0",
  "pytest>=7.0",
  "pre-commit==4.6.1",
  "ruff==0.16.2",
  "pexpect>=4.8",
]

[project.scripts]
wg-gaming-installer = "wg_gaming_installer.install_scripts:main"

[tool.setuptools.packages.find]
include = ["wg_gaming_installer*"]

[tool.black]
line-length = 88
target-version = ["py312"]
skip-string-normalization = true

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
line_length = 88

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E203", "E231", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
